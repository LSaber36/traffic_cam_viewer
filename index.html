<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CA CCTV Viewer</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- Stylesheets (order matters: base first, then components) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/selector.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/card.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     HEADER / NAV BAR
════════════════════════════════════════════════════════════ -->
<header>
  <div class="header-row">

    <!-- Logo + title -->
    <div class="logo-icon">📡</div>
    <h1>CA CCTV<br>Viewer</h1>

    <!-- Stream Size control (spinbox only, no slider) -->
    <div class="size-control">
      <div class="size-label-wrap">
        <span class="size-label">Stream Size</span>
      </div>
      <div class="size-spinbox">
        <input type="number" class="size-input" id="size-input" min="1" max="5" style="display:none">
        <button class="size-spin-btn" id="btn-size-minus" title="Smaller streams">&#8722;</button>
        <input type="number" class="size-input" id="size-display" min="1" max="5">
        <button class="size-spin-btn" id="btn-size-plus"  title="Larger streams">&#43;</button>
      </div>
    </div>

    <!-- Right action cluster -->
    <div class="header-right">

      <!-- Light / Dark mode toggle -->
      <div class="theme-toggle">
        <span class="theme-label" id="theme-label">Dark</span>
        <div class="toggle-track" id="theme-track">
          <div class="toggle-thumb"></div>
          <!-- Moon icon (dark mode) -->
          <svg class="theme-icon theme-icon-dark" width="10" height="10" viewBox="0 0 24 24"
               fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <!-- Sun icon (light mode) -->
          <svg class="theme-icon theme-icon-light" width="10" height="10" viewBox="0 0 24 24"
               fill="none" stroke="var(--text)" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </div>
      </div>

      <div class="hdiv"></div>

      <!-- Map link button -->
      <a class="hbtn" id="btn-map"
         href="https://gisdata-caltrans.opendata.arcgis.com/datasets/450df5bed93c4558a7264b7ef64187e6_0/explore?location=37.273970%2C-119.846170%2C6"
         target="_blank" rel="noopener" title="View Caltrans map">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          <line x1="8" y1="2" x2="8" y2="18"/>
          <line x1="16" y1="6" x2="16" y2="22"/>
        </svg>
      </a>

      <div class="hdiv"></div>

      <!-- Streams button (panel is at body level, not here) -->
      <button class="hbtn" id="btn-streams" title="Select streams">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="8"  y1="6"  x2="21" y2="6"/>
          <line x1="8"  y1="12" x2="21" y2="12"/>
          <line x1="8"  y1="18" x2="21" y2="18"/>
          <line x1="3"  y1="6"  x2="3.01" y2="6"/>
          <line x1="3"  y1="12" x2="3.01" y2="12"/>
          <line x1="3"  y1="18" x2="3.01" y2="18"/>
        </svg>
        <span class="btn-text">Streams</span>
      </button>

      <div class="hdiv"></div>

      <!-- Refresh all streams -->
      <button class="hbtn" id="btn-refresh-all" title="Refresh all streams">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
        </svg>
        <span class="btn-text">Refresh</span>
      </button>

      <!-- Global Play / Pause all -->
      <button class="hbtn" id="btn-play-all" title="Play or pause all streams">
        <svg id="play-all-icon" width="11" height="11"
             viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
        <span class="btn-text" id="play-all-label">Play All</span>
      </button>

    </div><!-- /header-right -->
  </div><!-- /header-row -->
</header>

<!-- ═══════════════════════════════════════════════════════════
     BACKDROP — blocks page while selector is open.
     Must come before selector-panel in DOM so panel is on top.
════════════════════════════════════════════════════════════ -->
<div class="backdrop" id="backdrop"></div>

<!-- ═══════════════════════════════════════════════════════════
     SELECTOR PANEL — lives at body level so it is NOT trapped
     inside the header's backdrop-filter stacking context.
════════════════════════════════════════════════════════════ -->
<div class="selector-panel" id="selector-panel">

  <!-- District + County dropdowns -->
  <div class="selector-dropdowns">
    <div class="sel-dropdown-group">
      <label class="sel-dropdown-label" for="sel-district">District</label>
      <select class="sel-dropdown" id="sel-district"></select>
    </div>
    <div class="sel-dropdown-group">
      <label class="sel-dropdown-label" for="sel-county">County</label>
      <select class="sel-dropdown" id="sel-county">
        <option value="">— select district first —</option>
      </select>
    </div>
    <div class="sel-dropdown-group">
      <label class="sel-dropdown-label" for="sel-sort-col">Sort By</label>
      <select class="sel-dropdown" id="sel-sort-col">
        <option value="nearby">Nearby Place</option>
        <option value="name">Camera Name</option>
        <option value="longitude">Longitude</option>
        <option value="latitude">Latitude</option>
        <option value="route">Route</option>
      </select>
    </div>

    <!-- Longitude filter -->
    <div class="sel-lon-row">
      <input type="checkbox" class="sel-lon-checkbox" id="sel-lon-enabled">
      <label class="sel-dropdown-label" for="sel-lon-enabled">Longitude</label>
      <div class="sel-lon-inputs">
        <div class="sel-lon-group">
          <label class="sel-lon-label" for="sel-lon-min">Min</label>
          <input type="number" class="sel-lon-input" id="sel-lon-min" step="0.0001">
        </div>
        <div class="sel-lon-group">
          <label class="sel-lon-label" for="sel-lon-max">Max</label>
          <input type="number" class="sel-lon-input" id="sel-lon-max" step="0.0001">
        </div>
      </div>
    </div>

  </div>

  <!-- Select All + Search -->
  <div class="selector-search">
    <span class="sel-section-label">Traffic Cams</span>
    <input class="sel-search-input" id="sel-search"
           type="search" placeholder="Filter by name…"
           autocomplete="off">
    <div class="sel-all-row" id="sel-all-row">
      <input type="checkbox" class="sel-all-checkbox" id="sel-all-cb">
      <span class="sel-all-label">Select All</span>
    </div>
  </div>

  <!-- Scrollable stream list -->
  <div class="selector-list" id="selector-list"></div>

  <!-- Footer: count + Apply -->
  <div class="selector-footer">
    <span class="sel-count" id="sel-count">0 selected</span>
    <button class="sel-apply" id="sel-apply">Apply</button>
  </div>

</div><!-- /selector-panel -->

<!-- ═══════════════════════════════════════════════════════════
     FETCH ERROR POPUP
════════════════════════════════════════════════════════════ -->
<div class="popup-overlay" id="popup-overlay">
  <div class="popup-box">
    <div class="popup-icon">⚠️</div>
    <div class="popup-title">Connection Error</div>
    <div class="popup-msg" id="popup-message">
      Could not load camera data from the Caltrans server.
    </div>
    <div class="popup-msg">
      Please check your connection and refresh the page to try again.
    </div>
    <button class="popup-retry" onclick="location.reload()">Reload Page</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     MAIN GRID AREA
════════════════════════════════════════════════════════════ -->
<main>
  <div id="grid">
    <div id="empty" style="display:block">Loading streams&hellip;</div>
  </div>
</main>

<!--
     Load order:
       1. hls.js               — HLS playback engine (CDN)
       2. js/config.js         — constants
       3. js/stream_loader.js  — fetches district CSVs, builds CALTRANS_DISTRICTS
       4. js/stream_card.js    — escHtml, escAttr, buildCard, activePlayers
       5. js/nav_bar.js        — size control, theme, play/pause/refresh
       6. js/stream_selector.js — stream selector panel, enabledSet
       7. js/main.js           — showErrorPopup, renderGrid, boot
-->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script src="js/config.js"></script>
<script src="js/stream_loader.js"></script>
<script src="js/stream_card.js"></script>
<script src="js/nav_bar.js"></script>
<script src="js/stream_selector.js"></script>
<script src="js/main.js"></script>

</body>
</html>
